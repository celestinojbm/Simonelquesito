<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Simón El Quesito — Salsamentaria">
  <!-- Recreación en SVG del logo real (mascota + rótulo circular), aprobada
       por el propietario — no es el archivo de marca original. Si más
       adelante llega el archivo real, reemplazar estos tres SVG. -->
  <defs>
    <path id="topArc" d="M 20 76 A 92 92 0 0 1 180 76" fill="none"/>
    <path id="botArc" d="M 8 96 A 96 96 0 0 0 140 188" fill="none"/>
  </defs>

  <circle cx="100" cy="100" r="94" fill="#FCE6A0"/>

  <!-- anillo verde azulado (arco superior derecho + inferior) -->
  <path d="M 178 78 A 90 90 0 0 1 130 172" fill="none" stroke="#2F5350" stroke-width="4" stroke-linecap="round"/>
  <path d="M 22 78 A 90 90 0 0 0 34 118" fill="none" stroke="#2F5350" stroke-width="4" stroke-linecap="round"/>

  <!-- cuña de queso -->
  <path d="M 48 122 L 78 55 L 108 118 Q 108 132 78 132 Q 48 132 48 122 Z"
        fill="#F3A93A" stroke="#C97F1E" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="73" cy="108" r="6" fill="#C97F1E"/>
  <circle cx="93" cy="115" r="4.5" fill="#C97F1E"/>
  <circle cx="83" cy="88" r="4" fill="#C97F1E"/>

  <!-- mascota: cabeza -->
  <circle cx="130" cy="108" r="38" fill="#F7C989"/>
  <!-- pelo -->
  <path d="M92 100 Q90 62 130 60 Q168 58 168 92 Q168 78 150 74 Q152 90 140 84 Q142 96 128 88 Q118 94 116 82 Q104 86 100 100 Z" fill="#241F1C"/>
  <!-- ojos -->
  <circle cx="118" cy="112" r="10" fill="#fff"/>
  <circle cx="146" cy="110" r="10" fill="#fff"/>
  <circle cx="120" cy="114" r="6.5" fill="#241F1C"/>
  <circle cx="148" cy="112" r="6.5" fill="#241F1C"/>
  <circle cx="122" cy="111" r="1.8" fill="#fff"/>
  <circle cx="150" cy="109" r="1.8" fill="#fff"/>
  <!-- boca sonriente -->
  <path d="M122 132 Q134 144 150 130 Q144 140 133 140 Q124 140 122 132 Z" fill="#241F1C"/>

  <!-- cuerpo / camiseta -->
  <path d="M96 150 Q130 132 168 150 L172 190 L92 190 Z" fill="#E86A5C"/>
  <path d="M92 174 L172 174 L172 190 L92 190 Z" fill="#8FCFC0"/>

  <!-- textos curvos -->
  <text font-family="Verdana, Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="0.5" fill="#2F5350">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SIMÓN EL QUESITO</textPath>
  </text>
  <text font-family="Verdana, Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="-0.2" fill="#DE3730">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">SALSAMENTARIA</textPath>
  </text>
</svg>
