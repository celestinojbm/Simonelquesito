name: CI

on:
  # La rama predeterminada real no es `main`. Sin filtro de ramas: CI corre en
  # cualquier push (incluida la predeterminada tras el merge) y no queda obsoleto
  # si la rama predeterminada se renombra. La BD de CI es Postgres en localhost
  # (efímero); nunca usa credenciales ni base de producción.
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salsamentaria
          POSTGRES_PASSWORD: salsamentaria_dev_password
          POSTGRES_DB: salsamentaria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salsamentaria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://salsamentaria:salsamentaria_dev_password@localhost:5432/salsamentaria
      SESSION_SECRET: ci-secret-no-productivo
      PAYMENT_PROVIDER: sandbox
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      MESSAGING_PROVIDER: console
      STOREFRONT_ENABLED: "false"
      # CI es un entorno de PRUEBA autorizado: habilita el seed y las cuentas
      # demo explícitamente (nunca se activa en producción — ver src/lib/auth/demo.ts).
      DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crear .env.local para scripts de BD
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "SESSION_SECRET=$SESSION_SECRET"
            echo "PAYMENT_PROVIDER=$PAYMENT_PROVIDER"
            echo "PAYMENT_WEBHOOK_SECRET=$PAYMENT_WEBHOOK_SECRET"
            echo "MESSAGING_PROVIDER=$MESSAGING_PROVIDER"
          } > .env.local
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
